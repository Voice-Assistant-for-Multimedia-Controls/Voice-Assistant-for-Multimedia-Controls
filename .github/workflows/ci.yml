name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and syntax checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -r requirements.txt

      - name: Run Python syntax check
        run: python -m compileall src main.py

      - name: Run lint checks
        run: ruff check src tests main.py --select=E9,F63,F7,F82

  unit-tests:
    name: Unit tests (Windows, Python 3.11)
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install unittest-xml-reporting

      - name: Run unit tests and generate JUnit XML
        run: python -m xmlrunner discover -o test-results

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 90

  smoke-tests:
    name: Smoke tests
    needs: unit-tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run smoke tests
        run: python -m unittest tests.test_smoke -v

  coverage:
    name: Coverage report
    needs: smoke-tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage
          python -m pip install -r requirements.txt

      - name: Generate branch coverage reports
        run: |
          coverage run --branch -m unittest discover -v
          coverage report -m | Out-File -FilePath coverage-summary.txt -Encoding utf8
          coverage html --directory htmlcov
          coverage xml -o coverage.xml

      - name: Upload line and branch coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-summary.txt
            htmlcov/
          if-no-files-found: warn
          retention-days: 90
