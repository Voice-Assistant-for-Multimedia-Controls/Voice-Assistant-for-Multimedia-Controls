name: Hardware validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  hardware-validation:
    name: Live device validation
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Confirm hardware prerequisites are present
        run: python scripts/hardware_check.py

      - name: Print guidance for live validation
        run: |
          Write-Host "Hardware validation is running on a self-hosted Windows runner."
          Write-Host "Verify microphone input, webcam gestures, speech feedback, and media controls manually before release."
          Write-Host "Recommended checks: play music, pause, volume up, next song, previous song, quit."
